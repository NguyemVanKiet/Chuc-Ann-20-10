    <link rel="shortcut icon" href="./rose.png">

    <!-- ================= CHÈN CSS RIÊNG ================= -->
    <!-- CSS của phần thư viện ảnh (File 1) -->
    <link rel="stylesheet" type="text/css" href="./style-gallery.css">

    <!-- CSS của phần vườn hoa và bầu trời đêm (File 2) -->
    <link rel="stylesheet" type="text/css" href="./style-flower.css">

    <style>
    /* 1. Xử lý phần nền (hoa và bầu trời) */
    .night, .flowers {
        position: fixed !important;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: 0; /* Đưa xuống lớp dưới cùng */
        pointer-events: none; /* Xuyên chuột để tương tác với ảnh */
    }

    /* 2. Ẩn dòng chữ thừa ở góc trên bên trái */
    .happy-woman-day {
        display: none !important;
    }

    /* 3. Đảm bảo phần ảnh hiển thị bao trọn màn hình */
    main {
        position: relative;
        z-index: 10;
        background: transparent !important;
        width: 100vw;
        height: 100vh;
    }

    /* 4. Đẩy cụm chữ ở giữa lên cao để không bị đè vào nụ hoa */
    .content {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        transform: translateY(-80px); /* Kéo toàn bộ cụm chữ lên trên 80px (bạn có thể tăng/giảm số này) */
    }

    /* 5. Thêm bóng đen cho chữ để nổi bật, không bị chìm vào nền ảnh/hoa */
    .content__title {
        text-shadow: 2px 2px 15px rgba(0, 0, 0, 0.9), -2px -2px 15px rgba(0, 0, 0, 0.9);
    }

    .cursor {
        z-index: 9999;
    }
</style>
